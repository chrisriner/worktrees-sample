<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="index.html">Hello World</a>
    <!-- To add a page: create it, then add a link here. -->
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="site-main">
    <h1>Contact</h1>

    <p>
      Send a message using the form below and we'll get back to you.
    </p>

    <!-- UI only: this form has no action, so nothing is sent anywhere yet. -->
    <form class="contact-form">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="form-field">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject">
      </div>

      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button type="submit" class="button">Send message</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Hello World</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
